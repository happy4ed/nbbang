name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Install NDK
        run: |
          NDK_VERSION=$(cat $FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/com/flutter/gradle/FlutterExtension.kt 2>/dev/null | grep -oP 'ndkVersion.*?"[^"]*"' | grep -oP '"\K[^"]+' | head -1 || echo "27.0.12077973")
          echo "Installing NDK: $NDK_VERSION"
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" || \
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Build debug APK (diagnostic)
        run: flutter build apk --debug 2>&1 | tee /tmp/debug_log.txt; exit ${PIPESTATUS[0]}

      - name: Build release APK
        run: flutter build apk --release 2>&1 | tee /tmp/release_log.txt; exit ${PIPESTATUS[0]}

      - name: Send APK to Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -F "content=**nbbang APK 빌드 완료** ✅ (${SIZE})" \
            -F "file=@${APK};filename=nbbang-release.apk"

      - name: Send error to Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          LOG=$(tail -80 /tmp/debug_log.txt /tmp/release_log.txt 2>/dev/null | grep -E "error:|Error|FAILURE|Exception|Caused by" | tail -30 || echo "로그 없음")
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"**nbbang APK 빌드 실패** ❌\n\`\`\`\n${LOG}\n\`\`\`\"}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: receipt-splitter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
