name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze_log.txt; exit ${PIPESTATUS[0]}

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/nbbang-release.keystore

      - name: Install NDK
        run: |
          NDK_VERSION=$(cat $FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/com/flutter/gradle/FlutterExtension.kt 2>/dev/null | grep -oP 'ndkVersion.*?"[^"]*"' | grep -oP '"\K[^"]+' | head -1 || echo "27.0.12077973")
          echo "Installing NDK: $NDK_VERSION"
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" || \
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Build debug APK (diagnostic)
        run: flutter build apk --debug 2>&1 | tee /tmp/debug_log.txt; exit ${PIPESTATUS[0]}

      - name: Build release APK (arm64)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 2>&1 | tee /tmp/release_log.txt; exit ${PIPESTATUS[0]}

      - name: Publish GitHub Release and notify Discord
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIZE=$(du -sh "$APK" | cut -f1)
          SIZE_BYTES=$(stat -c%s "$APK")

          # Upsert 'latest-apk' release
          RELEASE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest-apk")
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; r=json.load(sys.stdin); print(r.get('id',''))" 2>/dev/null)

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              -d '{"tag_name":"latest-apk","name":"Latest APK (arm64)","body":"Auto-updated on every push.","prerelease":true}' | \
              python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          else
            # Delete old assets
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              python3 -c "import sys,json; [print(a['id']) for a in json.load(sys.stdin)]" | \
              while read AID; do
                curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/assets/$AID"
              done
          fi

          # Upload APK
          DOWNLOAD_URL=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=nbbang-release.apk" \
            --data-binary "@$APK" | python3 -c "import sys,json; print(json.load(sys.stdin).get('browser_download_url',''))")

          # Try to send APK file directly if under 25MB, else send link
          if [ "$SIZE_BYTES" -lt 26214400 ]; then
            curl -s -X POST "$DISCORD_WEBHOOK" \
              -F "content=**nbbang APK 빌드 완료** ✅ (${SIZE})" \
              -F "file=@${APK};filename=nbbang-release.apk"
          else
            curl -s -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"**nbbang APK 빌드 완료** ✅ (${SIZE})\n다운로드 (직접 설치): ${DOWNLOAD_URL}\"}"
          fi

      - name: Send error to Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          LOG=$(cat /tmp/analyze_log.txt /tmp/debug_log.txt /tmp/release_log.txt 2>/dev/null | grep -E "error:|Error|FAILURE|Exception|Caused by|warning" | tail -30 || echo "로그 없음")
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"**nbbang APK 빌드 실패** ❌\n\`\`\`\n${LOG}\n\`\`\`\"}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: receipt-splitter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
